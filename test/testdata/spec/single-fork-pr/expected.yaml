name: route-12
spec:
  cluster: stage-eks
  labels:
    signadot/github-pull-request: "12"
    signadot/github-repo: acme/route
    team: payments
  ttl:
    duration: 2d
  forks:
  - customizations:
      env:
      - name: LOG_LEVEL
        value: debug
      images:
      - image: ghcr.io/acme/route:abc1234
    forkOf:
      kind: Deployment
      name: route
      namespace: hotrod
