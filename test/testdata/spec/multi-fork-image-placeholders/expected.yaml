name: hotrod-345
spec:
  cluster: stage-eks
  labels:
    signadot/github-pull-request: "345"
    signadot/github-repo: signadot/hotrod
  forks:
  - customizations:
      env:
      - name: DEPLOY_ENV
        value: sandbox
      - name: LOG_LEVEL
        value: debug
      images:
      - image: ghcr.io/acme/route:0123456789abcdef0123456789abcdef01234567
    forkOf:
      kind: Deployment
      name: route
      namespace: hotrod
  - customizations:
      env:
      - name: DEPLOY_ENV
        value: sandbox
      - name: LOG_LEVEL
        value: info
      images:
      - image: ghcr.io/acme/frontend:0123456789abcdef0123456789abcdef01234567
    forkOf:
      kind: Rollout
      name: frontend
      namespace: web
  - customizations:
      env:
      - name: DEPLOY_ENV
        value: sandbox
      - name: LOG_LEVEL
        value: info
      images:
      - image: ghcr.io/acme/customer:pinned
    forkOf:
      kind: Deployment
      name: customer
      namespace: hotrod
