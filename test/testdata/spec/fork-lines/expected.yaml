name: hotrod-31
spec:
  cluster: prod-eks
  labels:
    signadot/github-pull-request: "31"
    signadot/github-repo: acme/hotrod
  forks:
  - customizations:
      env:
      - name: LOG_LEVEL
        value: debug
      images:
      - image: ghcr.io/acme/route:abc1234
    forkOf:
      kind: Deployment
      name: route
      namespace: hotrod
  - customizations:
      env:
      - name: LOG_LEVEL
        value: debug
      images:
      - image: ghcr.io/acme/frontend:abc1234
    forkOf:
      kind: Rollout
      name: frontend
      namespace: web
