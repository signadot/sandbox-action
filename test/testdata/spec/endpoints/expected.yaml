name: checkout-456
spec:
  cluster: staging
  labels:
    signadot/github-pull-request: "456"
    signadot/github-repo: acme/checkout
  defaultRouteGroup:
    endpoints:
    - name: storefront
      target: http://storefront.shop.svc:80
    - name: orders
      target: http://orders.shop.svc:80
  forks:
  - customizations:
      env:
      - name: FEATURE_FLAGS
        value: preview
      images:
      - image: ghcr.io/acme/orders:deadbeef
    forkOf:
      kind: Deployment
      name: orders
      namespace: shop
